<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AssOnTrack</title>
<meta name="description" content="Progress, diet and passion tracker">
<meta name="theme-color" content="#060b17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AssOnTrack">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}body{font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: starship command console. Fixed starfield behind; left sidebar + top status bar; HUD panels in auto-fit grids. Under 860px the sidebar becomes a bottom dock. Single deliberate dark look. */
:root{
  --void:#060b17; --deep:#0a1324; --panel:rgba(10,16,46,.72); --panel-hi:rgba(18,28,74,.8);
  --line:#1b2f6e; --line-hi:#2f4ea8; --fg:#e6eeff; --muted:#9aaad6; --dim:#6b7cb0;
  --cyan:#4cc9ff; --magenta:#2f7bff; --violet:#8fd8ff; --amber:#ffb648; --lime:#2ee6c5; --red:#ff5d6c;
  --display:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:#000;color:var(--fg);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
.shell{position:relative;z-index:1;display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}

/* sidebar */
aside{background:linear-gradient(180deg,rgba(6,10,34,.92),rgba(4,6,22,.92));border-right:1px solid var(--line);display:flex;flex-direction:column;padding-block:22px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px 22px}
.logo svg{width:34px;height:34px;flex:none}
.logo b{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em}
.logo b span{color:var(--cyan)}
.logo small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.12em}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;background:none;border:1px solid transparent;border-radius:10px;color:var(--muted);font:inherit;font-size:14.5px;font-weight:500;padding:10px 12px;cursor:pointer;text-align:left;position:relative}
.navbtn svg{width:20px;height:20px;flex:none;color:var(--c,var(--cyan))}
.navbtn:hover{color:var(--fg);background:rgba(76,201,255,.04)}
.navbtn[aria-selected="true"]{color:var(--fg);background:linear-gradient(90deg,rgba(76,201,255,.14),rgba(76,201,255,0));border-color:rgba(76,201,255,.18)}
.navbtn[aria-selected="true"]::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.side-foot{margin-top:auto;font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.6;padding:0 8px}
.side-foot .ok{color:var(--lime)}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:16px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:rgba(5,8,28,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);position:relative;overflow:hidden}
.topbar::after{content:"";position:absolute;left:-30%;bottom:0;height:1px;width:30%;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:sweep 6s linear infinite}
@keyframes sweep{to{left:100%}}
.topbar h1{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.14em;text-transform:uppercase;margin:0;flex:1;min-width:0}
.topbar h1 small{display:block;font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.14em;color:var(--muted);margin-top:3px;text-transform:uppercase}
.pill{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);background:transparent;border:1px solid rgba(76,201,255,.45);border-radius:99px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.pill:hover{background:rgba(76,201,255,.1);box-shadow:0 0 16px rgba(76,201,255,.25)}
.pill.mag{color:var(--magenta);border-color:rgba(47,123,255,.5)}
.pill.mag:hover{background:rgba(47,123,255,.1);box-shadow:0 0 16px rgba(47,123,255,.25)}
.clock{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right;line-height:1.4;white-space:nowrap}
.clock b{color:var(--fg);font-weight:400;font-size:14px}
#view{flex:1;overflow-y:auto;padding-block:24px 40px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px dashed rgba(255,182,72,.55);background:rgba(255,182,72,.06);color:var(--amber);border-radius:12px;padding:10px 14px;margin-bottom:20px;font-size:13.5px}
.banner b{font-family:var(--mono);letter-spacing:.1em;font-weight:400}
.banner span{flex:1;min-width:200px;color:var(--fg)}

/* panels */
.grid{display:grid;gap:18px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.cols{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.cols2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
@media (max-width:1px){.shell{grid-template-columns:200px minmax(0,1fr)}#view,.topbar{padding-left:20px}}
.stack{display:grid;gap:18px;align-content:start;min-width:0}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 18px 18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);min-width:0}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--c,var(--cyan));opacity:.8;pointer-events:none}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.ph span{font-family:var(--body);font-weight:600;font-size:14.5px;letter-spacing:.02em}
.ph i{font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.ph i.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime);margin-right:7px;vertical-align:1px;animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:20px 14px}
.tile svg.ic{width:30px;height:30px;color:var(--c);filter:drop-shadow(0 0 6px var(--c))}
.tile small{font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.tile b{font-family:var(--mono);font-weight:400;font-size:28px;color:var(--c);text-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent);line-height:1.05}
.tile em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.06em}
.tile.gauge{flex-direction:row;justify-content:space-around;text-align:left}
.tile.gauge > div{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.tile.gauge svg.g{width:120px;height:74px;flex:none}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.empty{font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.06em;text-align:center;padding:34px 10px;line-height:1.7;text-transform:uppercase}

/* rows */
.rows{display:grid}
.r{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid rgba(27,42,99,.7)}
.r:last-child{border-bottom:0}
.r .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--cyan));box-shadow:0 0 8px var(--c,var(--cyan));flex:none}
.r .m{flex:1;min-width:0}
.r .m div{font-weight:500;overflow-wrap:anywhere}
.r .m small{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.05em}
.r .v{font-family:var(--mono);text-align:right;white-space:nowrap}
.r .v small{display:block;font-size:11.5px;color:var(--c,var(--muted))}
.x{background:none;border:0;color:var(--dim);font-size:18px;line-height:1;padding:4px 6px;cursor:pointer;border-radius:6px}
.x:hover{color:var(--red)}

/* forms */
form.f{display:grid;gap:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
label{display:grid;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:0}
input,select{font:inherit;font-family:var(--body);font-size:16px;letter-spacing:0;text-transform:none;color:var(--fg);background:rgba(2,4,16,.7);border:1px solid var(--line-hi);border-radius:6px;padding:10px 12px;width:100%;min-width:0;box-sizing:border-box}
input:focus,select:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(76,201,255,.15),0 0 14px rgba(76,201,255,.2)}
.btn{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--cyan);border-radius:6px;padding:13px 16px;background:linear-gradient(180deg,rgba(76,201,255,.22),rgba(76,201,255,.08));color:var(--cyan);cursor:pointer;text-shadow:0 0 10px rgba(76,201,255,.5)}
.btn:hover{box-shadow:0 0 22px rgba(76,201,255,.35)}
.btn.mag{border-color:var(--magenta);color:var(--magenta);background:linear-gradient(180deg,rgba(47,123,255,.2),rgba(47,123,255,.06));text-shadow:0 0 10px rgba(47,123,255,.5)}
.btn.red{border-color:var(--red);color:var(--red);background:rgba(255,93,108,.08);text-shadow:none}

/* meters */
.meter{display:grid;gap:7px}
.meter-top{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.meter-top b{font-family:var(--mono);font-weight:400}
.track{height:8px;background:rgba(27,42,99,.8);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;background:var(--c,var(--cyan));box-shadow:0 0 12px var(--c,var(--cyan))}
.passions{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid currentColor}
.note{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em;line-height:1.6;margin:14px 0 0}
.big{font-family:var(--mono);font-size:54px;line-height:1;color:var(--magenta);text-shadow:0 0 22px rgba(47,123,255,.55)}
.toast{position:fixed;z-index:20;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(14px);font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;background:rgba(6,12,40,.95);color:var(--cyan);border:1px solid var(--cyan);box-shadow:0 0 22px rgba(76,201,255,.35);padding:10px 18px;border-radius:4px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* readable, normal type over the hologram look */
body{font-size:15.5px;line-height:1.45}
.logo b{letter-spacing:0;font-weight:700;font-size:17px}
.logo small,.topbar h1,.topbar h1 small,.clock,.ph i,.tile em,.empty,.r .m small,.note,.chip,.banner b,.toast,.pill,label,.btn{text-transform:none;letter-spacing:0}
.logo small{font-size:12px}
.topbar h1{font-size:20px;font-weight:700}
.topbar h1 small{font-size:13px;font-weight:400}
.clock{font-size:13px}
label{font-size:13px;font-weight:500}
.btn{font-size:15px;text-shadow:none;border-radius:10px}
.pill{font-size:13.5px;font-weight:500}
.ph span{font-size:15.5px}
.ph i{font-size:12.5px}
.tile small{font-size:13.5px}
.tile b{font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;text-shadow:0 0 10px color-mix(in srgb,var(--c) 40%,transparent)}
.tile em{font-size:12.5px;color:var(--muted)}
.r .m small{font-size:12.5px}
.r .v,.meter-top b,.big{font-variant-numeric:tabular-nums}
.r .v small{font-size:12.5px}
.empty{font-size:14px;text-transform:none}
.note{font-size:13px}
.big{font-weight:700;font-size:52px}
.toast{font-size:14px;border-radius:10px}
.chip{font-size:12px;border-radius:99px}
.banner b{font-weight:600}
.panel{border-radius:14px;border-color:rgba(76,170,255,.24);background:linear-gradient(180deg,rgba(40,100,220,.12),rgba(8,14,42,.72));box-shadow:inset 0 1px 0 rgba(120,200,255,.12),0 0 24px rgba(30,110,255,.08)}
.panel::before,.panel::after{display:none}
.navbtn{border-radius:10px}
#bgimg{position:fixed;inset:0;z-index:0;pointer-events:none;background:#0a1a10 url("ramsau.jpg") 42% 55%/cover no-repeat}
.bgshade{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(90deg,rgba(4,8,20,.45),rgba(4,8,20,.05) 45%,rgba(4,8,20,.05) 60%,rgba(4,8,20,.3))}
aside{background:rgba(5,10,26,.82)!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.topbar{background:rgba(5,10,26,.55)}
.panel{background:linear-gradient(180deg,rgba(22,52,120,.55),rgba(6,12,32,.82));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cw{font-size:12px;color:var(--muted);text-align:center;padding-bottom:4px}
.cday{aspect-ratio:1.25;max-width:100%;background:rgba(10,24,60,.5);border:1px solid rgba(76,170,255,.14);border-radius:8px;color:var(--fg);font:inherit;font-size:13.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:2px}
.cday:hover{border-color:rgba(76,201,255,.5)}
.cday.today{border-color:var(--cyan);color:var(--cyan);font-weight:700;box-shadow:0 0 10px rgba(76,201,255,.3)}
.cday.sel{background:rgba(76,201,255,.2);border-color:var(--cyan)}
.cday i{display:flex;gap:3px;height:6px}
.cday i b,.cleg b{width:6px;height:6px;border-radius:50%;display:inline-block}
.cleg{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.cleg span{display:flex;align-items:center;gap:6px}
.calnav{padding:4px 11px}
.calhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.calhead h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.calnav{font-size:16px;padding:6px 14px}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid rgba(76,170,255,.2);border-radius:10px;overflow:hidden}
.mcal .cw{padding:9px 10px;font-size:13px;font-weight:600;color:var(--muted);background:rgba(10,26,64,.7);border-bottom:1px solid rgba(76,170,255,.2)}
.mc{min-height:108px;background:rgba(6,14,36,.6);border:0;border-right:1px solid rgba(76,170,255,.12);border-bottom:1px solid rgba(76,170,255,.12);color:var(--fg);font:inherit;text-align:left;padding:6px 7px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.mc:nth-child(7n){border-right:0}
.mc:hover{background:rgba(22,54,120,.55)}
.mc.out{color:var(--dim);background:rgba(3,8,22,.55)}
.mc .mn{font-size:13.5px;font-weight:600;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;flex:none}
.mc.today .mn{background:var(--cyan);color:#04101f;box-shadow:0 0 12px rgba(76,201,255,.6)}
.mc.sel{box-shadow:inset 0 0 0 2px var(--cyan);background:rgba(30,80,170,.35)}
.chips{display:grid;gap:3px;min-width:0;width:100%}
.chips em{font-style:normal;font-size:12px;line-height:1.35;padding:2px 6px;border-radius:4px;background:color-mix(in srgb,var(--c) 20%,transparent);border-left:2px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.chips small{font-size:11.5px;color:var(--muted);padding-left:4px}
.dayview{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;margin-top:20px;align-items:start}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px 32px}
.holopanel{display:flex;flex-direction:column}
.sexsw{display:inline-flex;gap:4px;align-items:center}
.sexsw button{width:30px;height:30px;border-radius:50%;font:inherit;font-size:16px;line-height:1;color:var(--muted);background:rgba(4,10,28,.6);border:1px solid rgba(76,170,255,.25);cursor:pointer;display:grid;place-items:center}
.sexsw button[aria-pressed="true"]{color:#04101f;background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px rgba(76,201,255,.45)}
.avrow{display:grid;gap:6px}
.avrow > span{font-size:12.5px;font-weight:600;color:var(--muted)}
.aved{margin-top:12px;padding-top:12px;border-top:1px solid rgba(76,170,255,.2);display:grid;gap:10px}
.avcats{display:flex;flex-wrap:wrap;gap:4px}
.avcat{font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:5px 7px;cursor:pointer}
.avcat[aria-pressed="true"]{color:var(--cyan);border-bottom-color:var(--cyan)}
.avopts{display:flex;flex-wrap:wrap;gap:6px}
.avopts .fchip{font-size:12.5px;padding:5px 11px}
.avfoot{margin-top:auto;padding-top:14px;display:grid;gap:12px}
.avfoot .aved{margin-top:0}
.avbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font:inherit;font-size:14px;font-weight:600;color:var(--cyan);background:rgba(76,201,255,.08);border:1px solid rgba(76,201,255,.35);border-radius:10px;padding:10px 14px;cursor:pointer;transition:background .15s,box-shadow .15s}
.avbtn:hover{background:rgba(76,201,255,.16);box-shadow:0 0 14px rgba(76,201,255,.25)}
.avbtn.on{color:#04101f;background:var(--cyan);border-color:var(--cyan)}
.holo{width:100%;max-width:260px;height:auto;margin:auto;display:block;overflow:visible}
.holo-fig{animation:hfloat 5s ease-in-out infinite,hflick 7s steps(1) infinite}
.holo-bar{animation:hscan 3.2s linear infinite}
.holo-ring{transform-origin:100px 378px;animation:hpulse 2.8s ease-out infinite}
@keyframes hfloat{50%{transform:translateY(-5px)}}
@keyframes hflick{0%,100%{opacity:1}62%{opacity:.75}63%{opacity:1}88%{opacity:.85}89%{opacity:1}}
@keyframes hscan{from{transform:translateY(360px)}to{transform:translateY(-40px)}}
@keyframes hpulse{from{transform:scale(.8);opacity:.7}to{transform:scale(1.25);opacity:0}}
.foot{margin-top:32px;padding-top:16px;border-top:1px solid rgba(76,170,255,.2);text-align:center;font-size:13px;color:var(--muted);line-height:1.5}
.cs{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 26px;align-items:center}
.cs-main{display:flex;align-items:center;gap:18px;min-width:0}
.cs-ring{width:110px;height:110px;flex:none}
.cs-txt{display:grid;gap:3px;min-width:0}
.cs-txt small{font-size:13px;color:var(--muted);font-weight:500}
.cs-txt b{font-size:24px;font-weight:700;letter-spacing:-.01em}
.cs-txt p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
.cs-lvs{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px}
.cs-lv{font-size:12.5px;font-weight:600}.cs-txt .cs-lv b{color:var(--fg);font-size:13px;font-weight:700;margin-left:2px;letter-spacing:0}
.cs-lv[data-lvl="Priority"]{color:#ff5d6c}.cs-lv[data-lvl="Moderate"]{color:#ffb648}.cs-lv[data-lvl="Bonus"]{color:#2ee6c5}

.plrow.nomove{animation:nomove .35s}
@keyframes nomove{25%{transform:translateY(-3px)}75%{transform:translateY(2px)}}
/* hold-to-change level */
.lvlsw button{position:relative;overflow:hidden;isolation:isolate;transition:color .2s,background .2s,transform .2s}
.lvlsw button>span{position:relative;z-index:1}
.lvlsw button::after{content:"";position:absolute;inset:0;z-index:0;border-radius:inherit;transform:scaleX(0);transform-origin:left;opacity:.9}
.lvlsw button[data-lvl="Priority"]::after{background:#ff5d6c}.lvlsw button[data-lvl="Moderate"]::after{background:#ffb648}.lvlsw button[data-lvl="Bonus"]::after{background:#2ee6c5}
.lvlsw button.holding{transform:scale(.96);color:#04101f}
.lvlsw button.holding::after{transform:scaleX(1);transition:transform 1s cubic-bezier(.4,0,.6,1)}
.lvlsw button.locked{transform:scale(1.04);color:#04101f}.lvlsw button.locked::after{transform:scaleX(1)}
.lvlsw button{touch-action:none;user-select:none;-webkit-user-select:none}

/* subtle delete */

.del-trigger:hover,.del-trigger:focus-visible{color:#ff5d6c;border-color:rgba(255,93,108,.35);background:rgba(255,93,108,.08);box-shadow:0 0 12px rgba(255,93,108,.2)}
.delform{width:100%;display:grid;gap:12px;padding:16px;border:1px solid rgba(255,93,108,.4);border-radius:12px;background:rgba(255,93,108,.06);box-shadow:0 0 20px rgba(255,93,108,.08)}
.delform p{margin:0;font-size:13.5px;line-height:1.5;color:var(--muted)}.delform p b{color:#ff8d98}
.delform code{font-family:ui-monospace,Menlo,monospace;color:#ff8d98;background:rgba(255,93,108,.12);padding:1px 6px;border-radius:4px;font-size:12.5px}
.delform input{max-width:260px;border-color:rgba(255,93,108,.35)}
.delform input:focus{border-color:#ff5d6c;box-shadow:0 0 0 3px rgba(255,93,108,.15)}

/* rename + inline status */
.pj-name,.tk-name{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.pj-name b{font-size:17px;line-height:1.3;letter-spacing:-.01em;font-weight:700;overflow-wrap:anywhere}
.tk-name b{font-size:17px;font-weight:600;overflow-wrap:anywhere;min-width:0}
.pj-top{align-items:center!important}.pj-top .pj-dot{margin-top:0!important}
.pen{flex:none;width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;border-radius:8px;background:none;color:var(--dim);cursor:pointer;transition:all .15s;margin:-4px -6px -4px 0}
.pen:hover,.pen:focus-visible{color:var(--cyan);border-color:rgba(76,201,255,.3);background:rgba(76,201,255,.08);box-shadow:0 0 10px rgba(76,201,255,.15)}
.tk-top{align-items:center}
.tkr-title{flex:0 1 auto!important}
.tkr-sp{flex:1}
.pj-top .pj-name b{flex:0 1 auto!important}
.tk-btns{flex-wrap:wrap}
.tk-btns .btn,.tk-btns .mv{white-space:nowrap}
.rnform{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.rnform input{flex:1;min-width:0;font-size:15px;font-weight:600;padding:7px 10px;border-radius:8px;border-color:rgba(76,201,255,.55);box-shadow:0 0 0 3px rgba(76,201,255,.12),0 0 14px rgba(76,201,255,.15)}
.rn-ok,.rn-x{flex:none;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;cursor:pointer;padding:0;font-size:18px;line-height:1}
.rn-ok{border:1px solid rgba(61,220,132,.5);background:rgba(61,220,132,.12);color:#3ddc84}
.rn-ok:hover{background:rgba(61,220,132,.22);box-shadow:0 0 10px rgba(61,220,132,.3)}
.rn-x{border:1px solid rgba(76,170,255,.25);background:none;color:var(--muted)}
.rn-x:hover{color:var(--fg)}
.pjs-top .rnform input{font-size:13.5px;padding:5px 8px}
.pjs-top .rn-ok,.pjs-top .rn-x{width:28px;height:28px}

/* passion header: darker glass */
.pdetail{padding-top:0;overflow:hidden}
.pd-hero{margin:0 -18px 18px;padding:18px 18px 4px;background:linear-gradient(180deg,rgba(1,4,14,.72),rgba(2,6,20,.62));backdrop-filter:blur(14px) saturate(120%);-webkit-backdrop-filter:blur(14px) saturate(120%);border-bottom:1px solid rgba(76,170,255,.22);box-shadow:0 1px 0 rgba(76,201,255,.08),0 10px 24px -12px rgba(0,0,0,.6);position:relative}
.pd-hero::after{content:"";position:absolute;left:10%;right:10%;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(76,201,255,.7),transparent);box-shadow:0 0 10px rgba(76,201,255,.5)}
.pd-hero .pstats div{background:rgba(255,255,255,.025);border-color:rgba(76,170,255,.12)}
.pd-hero .ptabs{margin-bottom:14px}

/* ===== darkness hierarchy: hero > section > item title > item body ===== */
:root{--d1:rgba(2,7,22,.62);--d2:rgba(2,8,26,.6);--d3:rgba(22,46,100,.24);--d-line:rgba(76,170,255,.16)}
/* level 1: section headers */
.pjhead,.tk-sec{background:var(--d1);border:1px solid var(--d-line);border-radius:14px;padding:12px 14px;margin-bottom:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 6px 18px -10px rgba(0,0,0,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pjhead,.tk-sec{border-radius:0!important;border-left:0!important;border-right:0!important}
.pjhead{margin:-18px -18px 16px;padding:12px 18px}
.pd-hero+.pjhead,.pd-hero+div>.pjhead{margin-top:-18px}
.tkwrap>div>.tk-sec:first-child,.tkwrap>div>.tk-sec.solo{margin-left:-18px;padding-left:18px}
.tk-sec .ph{margin-bottom:0}
.tk-sec .tkfilter{margin:12px 0 0}
.tk-sec .tkfilter.sub{margin-top:8px}
.ph.tk-sec.solo{display:flex;padding:12px 14px}
/* level 2 + 3: project cards */
.pjcard{background:var(--d3)!important;padding-top:0!important}
.pjcard .pj-top{margin:0 -18px;padding:14px 18px;background:var(--d2);border-bottom:1px solid var(--d-line);box-shadow:0 4px 12px -8px rgba(0,0,0,.5)}
.pjcard::before{z-index:1}
/* level 2 + 3: task groups */
.tkgroup{padding-left:0!important;border-left:0!important;gap:0!important;border:1px solid var(--d-line)!important;border-left:2px solid var(--pc,rgba(76,170,255,.3))!important;border-radius:12px;overflow:hidden;background:var(--d3)}
.tkgroup+.tkgroup{margin-top:12px!important}
.tkg-h{padding:10px 14px;background:var(--d2);border-bottom:1px solid var(--d-line)}
.tkg-b{display:grid;gap:8px;padding:10px}
.tksub{margin-left:2px}

/* fix: lighter section bars, In progress band full width */
:root{--d1:rgba(2,7,22,.34);--d2:rgba(6,16,42,.36);--d3:rgba(80,130,220,.15)}
.pjhead,.tk-top-band{margin:-18px -18px 16px!important;padding:12px 18px!important;border-top:0!important}
.tkwrap>div>.tk-sec.solo{margin-left:0!important;padding-left:14px!important}

/* filter chips -> segmented bar */
.tkfilter{display:inline-flex!important;flex-wrap:wrap;gap:0!important;max-width:100%;border:1px solid rgba(76,170,255,.28);border-radius:7px;overflow:hidden;background:rgba(2,8,24,.35);box-shadow:0 0 14px rgba(76,170,255,.06)}
.tkfilter .fchip{border:0!important;border-radius:0!important;border-left:1px solid rgba(76,170,255,.18)!important;background:transparent!important;box-shadow:none!important;color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 12px!important;gap:6px!important;position:relative;transition:color .15s,background .15s}
.tkfilter .fchip:first-child{border-left:0!important}
.tkfilter .fchip:hover{color:var(--fg);background:rgba(76,170,255,.06)!important}
.tkfilter .fchip[aria-pressed="true"]{color:#bfeaff!important;background:linear-gradient(180deg,rgba(76,201,255,.2),rgba(76,201,255,.08))!important;text-shadow:0 0 10px rgba(76,201,255,.6)}
.tkfilter .fchip[aria-pressed="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;border-radius:2px;background:var(--pc,var(--cyan));box-shadow:0 0 8px var(--pc,var(--cyan))}
.tkfilter .fchip i{background:rgba(76,170,255,.12)!important;color:var(--muted);font-size:11px;min-width:16px;height:16px}
.tkfilter .fchip[aria-pressed="true"] i{background:rgba(76,201,255,.25)!important;color:#dff4ff}
.tkfilter .fchip .pj-dot{width:7px;height:7px}
.tkfilter .fchip[aria-pressed="true"] .pj-dot{background:var(--pc)!important;box-shadow:0 0 8px var(--pc)!important}
.tkfilter.sub{display:inline-flex!important;margin-left:12px}
.tk-sec .tkfilter{margin-top:10px}
.tk-sec{display:block}
.tkfilter.sub .fchip{font-size:12px;padding:5px 11px!important}

/* sub-projects branch out of their project segment */
.tkf-chev{opacity:.6;transition:transform .25s ease}
.tkfilter .fchip.open .tkf-chev{opacity:1;color:var(--pc);filter:drop-shadow(0 0 4px var(--pc))}
.tkfilter .fchip.open{background:color-mix(in srgb,var(--pc) 14%,transparent)!important;color:#e6f6ff}
.tkfilter .fchip.branch::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;border-radius:2px;background:var(--pc);opacity:.45}
.tkf-subs{display:inline-flex;align-items:stretch;position:relative;background:color-mix(in srgb,var(--pc) 9%,rgba(2,8,24,.5));border-left:1px solid color-mix(in srgb,var(--pc) 55%,transparent);box-shadow:inset 0 0 14px color-mix(in srgb,var(--pc) 12%,transparent)}
.tkf-subs::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,var(--pc),transparent);box-shadow:0 0 8px var(--pc);opacity:.8}
.tkfilter .fchip.sub{font-size:12px!important;padding:6px 11px!important;color:color-mix(in srgb,var(--pc) 45%,#c9d6f2)!important;border-left:1px solid color-mix(in srgb,var(--pc) 22%,transparent)!important}
.tkf-subs .fchip.sub:first-child{border-left:0!important}
.tkfilter .fchip.sub:hover{color:#fff!important;background:color-mix(in srgb,var(--pc) 12%,transparent)!important}
.tkfilter .fchip.sub[aria-pressed="true"]{color:#fff!important;background:color-mix(in srgb,var(--pc) 24%,transparent)!important;text-shadow:0 0 10px var(--pc)}
.tkf-subs.pop{animation:tkfpop .38s cubic-bezier(.2,.9,.25,1) both;transform-origin:left center}
.tkf-subs.pop .fchip.sub{animation:tkfin .38s cubic-bezier(.2,.9,.25,1) both}
.tkf-subs.pop .fchip.sub:nth-child(2){animation-delay:.04s}.tkf-subs.pop .fchip.sub:nth-child(3){animation-delay:.08s}.tkf-subs.pop .fchip.sub:nth-child(4){animation-delay:.12s}.tkf-subs.pop .fchip.sub:nth-child(n+5){animation-delay:.16s}
@keyframes tkfpop{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes tkfin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.tkfilter.sub{display:none!important}

/* sub-projects hang below their project, wired to it */
.tkf-branch{position:relative;margin-top:10px;--cx:40px;--up:10px}
.tkf-wire{position:absolute;left:var(--cx);top:calc(-1 * var(--up));width:16px;height:calc(var(--up) + 15px);border-left:1.5px solid var(--pc);border-bottom:1.5px solid var(--pc);border-bottom-left-radius:8px;filter:drop-shadow(0 0 4px var(--pc));opacity:.9;pointer-events:none}
.tkf-subbar{margin-left:calc(var(--cx) + 16px)!important;margin-top:0!important;border-color:color-mix(in srgb,var(--pc) 55%,transparent)!important;background:color-mix(in srgb,var(--pc) 8%,rgba(2,8,24,.5))!important;box-shadow:0 0 14px color-mix(in srgb,var(--pc) 18%,transparent)!important}
.tkf-subbar .fchip.sub{border-left:1px solid color-mix(in srgb,var(--pc) 25%,transparent)!important}
.tkf-subbar .fchip.sub:first-child{border-left:0!important}
.tkf-branch.pop .tkf-wire{animation:wiredraw .3s ease-out both}
.tkf-branch.pop .tkf-subbar{animation:subdrop .38s cubic-bezier(.2,.9,.25,1) .12s both}
@keyframes wiredraw{from{clip-path:inset(0 100% 100% 0)}60%{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes subdrop{from{opacity:0;transform:translate(-10px,-4px)}to{opacity:1;transform:none}}
.tkfilter .fchip.open .tkf-chev{transform:rotate(90deg)}

/* task rows: darker than content, lighter than project title bars */
.tkg-b .tkrow,.tklist>.tkrow{background:rgba(4,12,32,.26)!important}
.tkg-b .tkcard,.tklist>.tkcard{background:rgba(4,12,32,.14)!important;padding-top:0!important;overflow:hidden}
.tkcard>.tk-top{margin:0 -14px;padding:11px 14px;background:rgba(4,12,32,.24);border-bottom:1px solid rgba(76,170,255,.14)}
.tkg-b .tkcard,.tklist>.tkcard{border-color:rgba(76,170,255,.2)}
/* task card actions */
.tk-time small{font-size:12.5px;color:var(--muted)}
.tk-btns{align-items:center}
.tk-end{margin-left:auto;display:flex;align-items:center;gap:6px}
.tk-ic{height:38px;min-width:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;cursor:pointer;padding:0 9px;font:inherit;font-size:12.5px;font-weight:600;transition:all .15s}
.tk-del{border:1px solid rgba(255,93,108,.28);background:rgba(255,93,108,.06);color:#ff5d6c}
.tk-del:hover,.tk-del.armed{border-color:#ff5d6c;background:rgba(255,93,108,.14);box-shadow:0 0 12px rgba(255,93,108,.3)}

.tk-done:hover,.tk-done.armed{background:#3ddc84;color:#03140a;border-color:#3ddc84;box-shadow:0 0 16px rgba(61,220,132,.5)}

.rn-proj{flex:0 1 190px;min-width:120px;width:auto;font-size:13.5px;padding:7px 10px;border-radius:8px;border-color:rgba(76,201,255,.45)}
.rnform{flex-wrap:nowrap!important;align-items:center!important;gap:6px!important}
.rnform>input,.rnform>select,.rnform>button{box-sizing:border-box;height:36px!important;margin:0!important;align-self:center}
.rnform>input{flex:1 1 auto!important;min-width:60px!important;padding:0 11px!important;line-height:34px}
.rnform>select{flex:0 1 170px!important;min-width:90px!important;padding:0 28px 0 10px!important;line-height:34px}
.rnform>.rn-ok,.rnform>.rn-x{flex:none!important;width:36px!important;padding:0!important;display:grid!important;place-items:center}
.pjs-top .rnform>input,.pjs-top .rnform>button{height:30px!important}
.pjs-top .rnform>.rn-ok,.pjs-top .rnform>.rn-x{width:30px!important}
.tk-top:has(.rnform) .tk-fold{align-self:center}

/* cancel timer / undo completion */
.tk-cancel{font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:none;border:1px solid rgba(76,170,255,.22);border-radius:10px;padding:10px 14px;cursor:pointer;white-space:nowrap;transition:all .15s}
.tk-cancel:hover{color:#ffb648;border-color:rgba(255,182,72,.45)}
.tk-cancel.armed{color:#ff5d6c;border-color:#ff5d6c;background:rgba(255,93,108,.08)}
.tkr-cancel{color:var(--muted)!important;background:transparent!important;font-size:18px!important;padding:0 12px!important}
.tkr-cancel:hover{color:#ff5d6c!important;background:rgba(255,93,108,.08)!important}
.tkr-cancel.armed{color:#ff5d6c!important;font-size:12px!important;background:rgba(255,93,108,.1)!important}
.tk-undo{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);background:none;border:1px solid rgba(76,170,255,.2);border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap;margin-left:6px;transition:all .15s}
.tk-undo:hover{color:var(--cyan);border-color:rgba(76,201,255,.45);box-shadow:0 0 10px rgba(76,201,255,.15)}
.tk-undo.armed{color:#ffb648;border-color:rgba(255,182,72,.6);background:rgba(255,182,72,.08)}
label.dim{opacity:.4}
.slotform label[hidden]{display:none!important}
.tk-reset{border:1px solid rgba(255,182,72,.3);background:rgba(255,182,72,.06);color:#ffb648}
.tk-reset:hover,.tk-reset.armed{border-color:#ffb648;background:rgba(255,182,72,.14);box-shadow:0 0 12px rgba(255,182,72,.3)}

<script>
/* ---------- state + storage (same data shape as before, so saved logs carry over) ---------- */
const EMPTY=()=>({goals:{kcal:2000,protein:130,weight:null,unit:"lb",len:"in"},meals:[],weights:[],meas:[],workouts:[],passions:[],sessions:[],events:[],projects:[],profile:{figure:"woman"}});
let data=EMPTY(),tab="dash",saveRef=null,storeNote="",demoOff=false;
try{demoOff=localStorage.getItem("aot-demo-off")==="1"}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>ymd(new Date());
const dayStr=off=>{const d=new Date();d.setDate(d.getDate()-off);return ymd(d)};
const fmtDate=s=>new Date(s+"T12:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});
const uid=()=>Math.random().toString(36).slice(2,10);
const n0=v=>Math.round(v).toLocaleString();
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800)}
const isEmpty=d=>!d.meals.length&&!d.weights.length&&!d.meas.length&&!d.workouts.length&&!d.passions.length&&!d.sessions.length&&!(d.events||[]).length;
const demoOn=()=>false;

let writing=false,pending=false,lastLocal=0;const canceledRuns=new Set();
const stripCanceled=d=>{let n=0;(d.passions||[]).forEach(p=>(p.tasks||[]).forEach(t=>{const b=(t.runs||[]).length;t.runs=(t.runs||[]).filter(r=>!canceledRuns.has(t.id+":"+r.s));n+=b-t.runs.length}));return n};
async function save(){
  lastLocal=Date.now();data._rev=Math.max(Date.now(),(data._rev||0)+1);
  try{localStorage.setItem("aot",JSON.stringify(data))}catch(e){}
  if(!saveRef)return;
  if(!navigator.onLine){syncDirty=true;if(!storeNote){storeNote="You're offline. Changes are kept on this device and will sync when you're back online.";render()}return}
  if(writing){pending=true;return}
  writing=true;
  try{await saveRef.set(JSON.parse(JSON.stringify(data)));syncDirty=false;if(storeNote){storeNote="";render()}}catch(e){syncDirty=true;toast("Couldn't sync right now · saved on this device")}
  writing=false;lastLocal=Date.now();if(pending){pending=false;save()}
}
try{const s=localStorage.getItem("aot");if(s)data=Object.assign(EMPTY(),JSON.parse(s))}catch(e){}
/* ---------- account sync (Supabase) ---------- */
const CFG=window.AOT_CONFIG||{};
const sb=(CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase&&supabase.createClient)?supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"aot-auth"}}):null;
let sbUser=null,syncDirty=false,pulling=false;
const skipAuth=()=>{try{return localStorage.getItem("aot-skip-auth")==="1"}catch(e){return false}};
function setUplink(){const u=$("#uplink");if(u){u.textContent=sbUser?"your account":"this device";u.className=sbUser?"ok":""}}
async function pull(){
  if(!sb||!sbUser||pulling)return;pulling=true;
  try{
    const {data:row,error}=await sb.from("trackers").select("data").eq("user_id",sbUser.id).maybeSingle();
    if(error)throw error;
    if(storeNote){storeNote=""}
    if(row&&row.data){const inc=row.data;
      if(!writing&&!pending&&(inc._rev||0)>(data._rev||0)){data=Object.assign(EMPTY(),inc);stripCanceled(data);try{localStorage.setItem("aot",JSON.stringify(data))}catch(e){}}
      else if((data._rev||0)>(inc._rev||0)||syncDirty)save()}
    else if(!isEmpty(data))save();
  }catch(e){storeNote=navigator.onLine?"Couldn't reach your account. Changes are kept on this device and will sync later.":"You're offline. Changes are kept on this device and will sync when you're back online.";syncDirty=true}
  pulling=false;render();
}
async function onSession(session){
  const u=session&&session.user||null;if((u&&u.id)===(sbUser&&sbUser.id))return;
  sbUser=u;
  saveRef=sbUser?{set:async v=>{const {error}=await sb.from("trackers").upsert({user_id:sbUser.id,data:v,updated_at:new Date().toISOString()});if(error)throw error}}:null;
  setUplink();
  if(sbUser){hideAuth();await pull()}else render();
}
function showAuth(mode){const a=$("#auth");if(!a)return;a.hidden=false;a.dataset.mode=mode||"in";$("#authMsg").textContent="";paintAuth();setTimeout(()=>{const i=$("#authEmail");i&&i.focus()},50)}
function hideAuth(){const a=$("#auth");if(a)a.hidden=true}
function paintAuth(){const a=$("#auth"),up=a.dataset.mode==="up";$("#authTitle").textContent=up?"Create your account":"Welcome back";$("#authSub").textContent=up?"Your logs will sync between your phone and computer.":"Sign in to sync your logs across your devices.";$("#authGo").textContent=up?"Create account":"Sign in";$("#authSwap").textContent=up?"I already have an account":"Create an account";$("#authPw").autocomplete=up?"new-password":"current-password"}
document.addEventListener("submit",async e=>{if(e.target.id!=="authForm")return;e.preventDefault();e.stopImmediatePropagation();if(!sb)return;
  const a=$("#auth"),up=a.dataset.mode==="up",email=$("#authEmail").value.trim(),pw=$("#authPw").value,msg=$("#authMsg"),go=$("#authGo");
  if(pw.length<6){msg.textContent="Use a password with at least 6 characters.";return}
  go.disabled=true;go.textContent=up?"Creating…":"Signing in…";msg.textContent="";

/* ---------- scoring ---------- */
const PTS_PER_HOUR=10,WEEK_BONUS=50,PTS_PER_LEVEL=500;
function weekKey(d){const x=new Date(d+"T12:00");x.setDate(x.getDate()-(x.getDay()+6)%7);return ymd(x)}
const fmtH=m=>{const h=Math.floor(m/60),mm=Math.round(m%60);return h&&mm?`${h}h ${mm}m`:h?`${h}h`:`${mm}m`};
function scoreAll(d){
  const mins=d.sessions.reduce((s,x)=>s+(+x.mins||0),0);let bonus=0;
  for(const p of d.passions){if(!p.goal)continue;const w={};
    d.sessions.filter(s=>s.pid===p.id).forEach(s=>{const k=weekKey(s.d);w[k]=(w[k]||0)+(+s.mins||0)});
    for(const k in w)if(w[k]>=p.goal*60)bonus+=WEEK_BONUS}
  const total=Math.round(mins/60*PTS_PER_HOUR)+bonus,wk=weekKey(today());
  const wkMins=d.sessions.filter(s=>weekKey(s.d)===wk).reduce((s,x)=>s+(+x.mins||0),0);
  return {total,mins,level:Math.floor(total/PTS_PER_LEVEL)+1,into:total%PTS_PER_LEVEL,wkMins,wkPts:Math.round(wkMins/60*PTS_PER_HOUR)};
}
function streak(d){const days=new Set(d.sessions.map(s=>s.d));let n=0,x=new Date();if(!days.has(today()))x.setDate(x.getDate()-1);while(days.has(ymd(x))){n++;x.setDate(x.getDate()-1)}return n}
const byDate=a=>[...a].sort((p,q)=>p.d<q.d?-1:p.d>q.d?1:0);
const PAL=["var(--cyan)","var(--magenta)","var(--violet)","var(--amber)","var(--lime)"];

const AX=`font-family="Inter,sans-serif" font-size="10.5" fill="#7b89bb"`;
function lineChart(points,color="#4cc9ff"){
  if(points.length<2)return `<div class="empty">Not enough data yet<br>Log two entries to see a trend</div>`;
  const W=380,H=200,L=40,R=10,T=12,B=26;

  const t0=+new Date(points[0].d),t1=+new Date(points[points.length-1].d),sp=Math.max(t1-t0,1);
  const x=d=>L+(+new Date(d)-t0)/sp*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const tk=[0,1,2,3].map(i=>lo+(hi-lo)*(i+.5)/4);
  const path=points.map((p,i)=>(i?"L":"M")+x(p.d).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");

   ${tk.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#1b2a63" stroke-dasharray="2 4"/><text x="${L-7}" y="${y(v)+3.5}" text-anchor="end" ${AX}>${v.toFixed(1)}</text>`).join("")}

function donut(d){

function bigCal(d){

  const y=calMonth.getFullYear(),m=calMonth.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,last=new Date(y,m+1,0);
  const start=new Date(y,m,1-off),endOff=(7-((last.getDay()+6)%7+1))%7,end=new Date(y,m,last.getDate()+endOff);
  const cells=[];
  for(let x=new Date(start);x<=end;x.setDate(x.getDate()+1)){const ds=ymd(x),it=dayItems(d,ds),out=x.getMonth()!==m;

  const it=dayItems(d,calSel);
  return `<div class="panel">
    <div class="calhead"><h2>${calMonth.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h2>
      <div style="display:flex;gap:8px"><button class="pill calnav" data-cal="-1" aria-label="Previous month">‹</button><button class="pill calnav" data-cal="0">Today</button><button class="pill calnav" data-cal="1" aria-label="Next month">›</button></div></div>

        <div class="rows">${it.ev.map(e=>`<div class="r" style="--c:var(--cyan)"><span class="dot"></span><div class="m"><div>${esc(e.title)}</div><small>${e.time?fmtTime(e.time):"All day"}</small></div>${del("events",e.id)}</div>`).join("")}
        ${it.logs.map(l=>`<div class="r" style="--c:${l.c}"><span class="dot"></span><div class="m"><div>${esc(l.t)}</div><small>${esc(l.s)}</small></div><div class="v">${l.v}</div></div>`).join("")}
        ${!it.ev.length&&!it.logs.length?`<div class="empty" style="padding:16px">Nothing planned or logged</div>`:""}</div></div>
      <form class="f" id="evForm"><div class="ph" style="margin-bottom:2px"><span>Add an event</span></div>

        <button class="btn">Add to calendar</button></form>

    const st0=+new Date(dd+"T12:00");(t.runs=t.runs||[]).push({s:st0,e:st0+mins*6e4,manual:true});data.sessions.push({id:uid(),pid:p.id,d:dd,mins,note:"Task: "+t.title+" (added manually)",taskId:t.id});addTimeFor=null;toast(fmtH(mins)+" added")}
  else if(f==="rnForm"){const k=e.target.dataset.rnKind,id=e.target.dataset.rnId,v=$("#rnIn").value.trim();if(!v){toast("Name can't be empty");return}if(k==="prj"){const x=prjById(id);if(x)x.title=v}else{const p=data.passions.find(q=>q.id===selP),t=p&&(p.tasks||[]).find(q=>q.id===id);if(t){const moved=$("#rnP")&&($("#rnP").value||null)!==(t.proj||null);t.title=v;if($("#rnP"))t.proj=$("#rnP").value||null;renaming=null;toast(moved?(t.proj?"Saved · moved to "+prjById(t.proj).title:"Saved · removed from project"):"Saved");return void(render(),save())}}renaming=null;toast("Renamed")}
  else if(f==="delForm"){if($("#delIn").value.trim().toLowerCase()!=="delete"){toast("Type delete to confirm");return}const id=selP,nm=(data.passions.find(x=>x.id===id)||{}).name;const pj=(data.projects||[]).filter(x=>x.pid===id).map(x=>x.id);data.passions=data.passions.filter(x=>x.id!==id);data.sessions=data.sessions.filter(x=>x.pid!==id);data.projects=(data.projects||[]).filter(x=>x.pid!==id&&!pj.includes(x.parent));if(projFilter===id)projFilter="all";selP=null;delOpen=false;toast(nm+" deleted")}
  else if(f==="subForm"){const par=e.target.dataset.parent,x=prjById(par);if(!x)return;data.projects.push({id:uid(),pid:x.pid,parent:par,title:$("#sbT").value.trim(),due:$("#sbD").value||"",status:"todo",created:Date.now()});addingSub=null;toast("Sub-project added")}
  else if(f==="prjForm"){data.projects=data.projects||[];data.projects.push({id:uid(),pid:selP,title:$("#pjT").value.trim(),due:$("#pjD").value||"",status:"todo",created:Date.now()});addingPrj=false;toast("Project created")}
  else if(f==="tkForm"){const p=data.passions.find(x=>x.id===selP);if(!p)return;const dd=$("#tkD").value,tt=$("#tkTm").value;let due=null;
    if(dd){if(!$("#tkAck").checked){toast("Tick the box to lock in a deadline");return}due=+new Date(dd+"T"+(tt||"23:59"));if(due<=Date.now()){toast("Pick a deadline in the future");return}}
    else if(tt){toast("Add a date for the deadline, or clear the time");return}
    p.tasks=p.tasks||[];const so=$("#tkS").value||"";if(so&&so<today()){toast("Start date can't be in the past");return}if(so&&due&&+new Date(so+"T00:00")>due){toast("Start date must be before the deadline");return}const pj=$("#tkP")?$("#tkP").value:"";p.tasks.push({id:uid(),proj:pj||null,title:$("#tkT").value.trim(),planH:num("#tkH")||0,startOn:so>today()?so:"",created:Date.now(),due,runs:[],doneAt:null});pTab="tasks";prjFocus=null;toast(due?"Task added · deadline locked":"Task added")}
  else if(f==="slotEditForm"){const p=data.passions.find(x=>x.id===selP);const old=p&&(p.slots||[]).find(x=>x.id===editSlot);if(!old)return;
    const st=$("#seS").value,en=$("#seE").value,fr=$("#seF").value||today(),once=$("#seR").value==="once",isDur=$("#seK").value==="dur",dur=isDur?parseHM($("#seH").value):null;
    if(isDur){if(!dur){toast("Enter the time as HH:MM, like 01:30");return}if(dur>1440){toast("That's more than a day");return}}else if(toMin(en)<=toMin(st)){toast("End time must be after start");return}if(fr<today()){toast("Pick today or a later date");return}
    const tm=isDur?{dur,start:undefined,end:undefined}:{start:st,end:en,dur:undefined};const nf=Object.assign(once?{day:dow(fr),once:fr,from:undefined}:{day:+$("#seD").value,from:fr,once:undefined},tm);
    const startedBefore=(old.created||0)<+new Date(today()+"T00:00")&&(old.once?old.once<today():(!old.from||old.from<today()));
    if(startedBefore){if(!old.once){const y=new Date(fr+"T12:00");y.setDate(y.getDate()-1);old.until=ymd(y)}
      const ns=Object.assign({id:uid(),created:Date.now()},nf);delete ns[once?"from":"once"];Object.keys(ns).forEach(k=>ns[k]===undefined&&delete ns[k]);p.slots.push(ns);
      data.sessions.forEach(s=>{if(s.pid===p.id&&s.slotId===old.id&&s.d>=fr)s.slotId=ns.id})}
    else{Object.assign(old,nf);if(once)delete old.from;else delete old.once;delete old.until;Object.keys(old).forEach(k=>old[k]===undefined&&delete old[k])}
    editSlot=null;toast("Time slot updated")}
  else if(f==="slotForm"){const p=data.passions.find(x=>x.id===selP);if(!p)return;const isDur=$("#slK").value==="dur",dur=isDur?parseHM($("#slH").value):null;let st=$("#slS").value,en=$("#slE").value;if(isDur){if(!dur){toast("Enter the time as HH:MM, like 01:30");$("#slH").focus();return}if(dur>1440){toast("That's more than a day");return}st=undefined;en=undefined}else{if(!st||!en){toast("Pick a start and end time");return}if(toMin(en)<=toMin(st)){toast("End time must be after start");return}}const D=isDur?{dur}:{};const fr=$("#slF").value||today(),once=$("#slR").value==="once";if(fr<today()){toast("Pick today or a later date");return}p.slots=p.slots||[];if($("#slR").value==="daily"){const g=uid(),now=Date.now();for(let dd=0;dd<7;dd++)p.slots.push(Object.assign(isDur?{}:{start:st,end:en},{id:uid(),grp:g,day:dd,from:fr,created:now},D));addingSlot=false;toast(fr>today()?"Daily slot starts "+fmtDate(fr):"Daily time slot added");render();save();return}p.slots.push(Object.assign(once?{id:uid(),day:dow(fr),once:fr,created:Date.now()}:{id:uid(),day:+$("#slD").value,from:fr,created:Date.now()},isDur?D:{start:st,end:en}));addingSlot=false;toast(once?"Session planned for "+fmtDate(fr):fr>today()?"Time slot starts "+fmtDate(fr):"Time slot added")}
  else if(f==="sessForm"){const p=data.passions.find(x=>x.id===selP);if(!p)return;const mins=(num("#ssH")||0)*60+(num("#ssM")||0);if(mins<=0){toast("Enter some time first");return}const dd=$("#ssD").value||today();data.sessions.push({id:uid(),pid:p.id,d:dd,time:$("#ssT").value||"",mins,note:$("#ssN").value.trim(),planned:dd>today()});toast(dd>today()?"Planned":"Added to log")}
  else if(f==="projForm"){data.projects=data.projects||[];data.projects.push({id:uid(),title:$("#prT").value.trim(),pid:$("#prP").value,due:$("#prD").value||"",status:"todo"});addingProj=false;toast("Project added")}
  else if(f==="pForm"){data.passions.push({id:uid(),name:$("#pName").value.trim(),lvl:$("#pLvl").value});addingP=false;toast("Passion added")}
  else if(f==="sForm"){const mins=(num("#sH")||0)*60+(num("#sM")||0);if(mins<=0){toast("Enter some time first");return}
    data.sessions.push({id:uid(),pid:$("#sP").value,d:$("#sD").value||today(),mins});toast(fmtH(mins)+" logged")}
  else if(f==="gForm"){Object.assign(data.goals,{kcal:num("#gK")||0,protein:num("#gP")||0,weight:num("#gW"),unit:$("#gU").value,len:$("#gL").value});toast("Goals saved")}
  else return;
  render();save();
});

/* ---------- clock + stardate ---------- */
function tick(){const d=new Date();$("#clk").textContent=d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
  $("#sd").textContent=d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}
tick();setInterval(tick,15000);
setInterval(()=>{document.querySelectorAll("[data-timer]").forEach(el=>{const[pid,tid]=el.dataset.timer.split(":");const p=data.passions.find(x=>x.id===pid);const t=p&&(p.tasks||[]).find(x=>x.id===tid);if(t)el.textContent=fmtClock(taskMs(t))})},1000);
setInterval(()=>{const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;if(tab==="dash"||(tab==="pass"&&selP))render()},60000);


/* always show the full desktop site: scale it down to fit narrow screens */
function fit(){const sh=$(".shell"),W=1180,vw=document.documentElement.clientWidth;
  if(vw<W){const k=vw/W;sh.style.cssText=`position:fixed;left:0;top:0;width:${W}px;height:${innerHeight/k}px;transform:scale(${k});transform-origin:0 0`}
  else sh.style.cssText=""}
addEventListener("resize",fit);fit();

render();

if("serviceWorker" in navigator&&location.protocol==="https:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
